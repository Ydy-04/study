<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>待办清单</title>
        <style>
            body {
                font-family: sans-serif;
                max-width: 400px;
                margin: 60px auto;
                padding: 0 20px;
            }
            input {
                padding: 8px;
                font-size: 16px;
                width: 250px;
            }
            button {
                padding: 8px 16px;
                font-size: 16px;
                cursor: pointer;
            }
            ul{
                list-style: none;
                padding: 0;
            }
            li {
                background-color: #f5f5f5;
                padding: 10px;
                margin: 6px 0;
                border-radius: 6px;
                display: flex;              /* 用 flex 让文字和按钮左右分开 */
                justify-content: space-between;
                align-items: center;
            }
            li.done {
                text-decoration: line-through; /* 删除线*/
                color: #999;
            }
            li button {
                    padding: 4px 10px;
                    font-size: 14px;
                    background-color: #e53935;
                    color: white;
                    border: none;
                    border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <h1>我的待办清单</h1>
        <input id="input" placeholder="输入要办的事" />
        <button id="addBtn">添加</button>

        <ul id="list"></ul>
        <p id="count"></p>
        <script>
            // 1.数据：每条待办是一个对象{text,done}
            let todos = [];

            // 2. 抓元素
            let input = document.querySelector("#input");
            let addBtn = document.querySelector("#addBtn");
            let list = document.querySelector("#list");

            // 3. 渲染函数：把 todos 数组"画"到页面上
            function render(){
                let html = "";
                for(let i = 0; i < todos.length ; i++){
                    let todo =todos[i]
                    // 三元运算符
                    let doneClass = todo.done ? ' class="done"' : "";
                    html = html + '<li data-index="' + i +'"' + doneClass + '>'+
                        todo.text +
                        '<button data-index="' + i + '">删除</button></li>';

                }
                list.innerHTML = html;

                let count = document.querySelector("#count"); 
                count.textContent = "共" + todos.length + "件事";
            }

            // 4. 点击"添加"按钮
            addBtn.addEventListener("click", function(){
                let text = input.value;     // 拿到输入框里的文字
                if (text !== ""){           // 空内容就不加
                    todos.push({text:text , done: false});       // 加入数组
                    input.value = "";       // 清空输入框
                    render();               // 重新渲染
                }
            });
            // 点击列表：区分‘删除还是勾选完成
            list.addEventListener("click", function(e){
                if (e.target.tagName === "BUTTON"){         // 点到的是按钮吗
                    let index = Number(e.target.getAttribute("data-index"));// 读出藏的索引
                    todos.splice(index , 1);
                    
                }else if(e.target.tagName === "LI"){
                    // 点的是待办本身-> 切换完成状态
                    let index = Number(e.target.getAttribute("data-index"));// 读出藏的索引
                    todos[index].done = !todos[index].done; // 取反切换
                }
                render();
            });
            
           


            
        </script>
    </body>
</html>
