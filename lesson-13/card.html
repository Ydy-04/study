<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>数组 array</title>
  </head>

  <body>
    <h1>按 F12 打开控制台看输出</h1>

    <script>
      // 1. 创建数组：方括号 []，逗号隔开
      let hobbies = ["篮球","羽毛球","看电影","游泳"];
      console.log("我的第一个爱好是："+hobbies[0]);
      console.log("我一共有"+hobbies.length+" 个爱好");
      hobbies.push("跑步"); // 在数组后面加一个
      console.log("现在有几个"+ hobbies.length + "个爱好");
      console.log("最后一个是："+ hobbies[hobbies.length-1]);
    </script>
  </body>
</html>
