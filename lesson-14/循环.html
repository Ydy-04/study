<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>for 循环</title>
  </head>

  <body>
    <h1>按 F12 打开控制台看输出</h1>

    <script>
      // 1. 最简单的循环：打印 0、1、2
      for (let i = 0; i < 3; i++) {
        console.log(i);
      }

      // 2. 循环 + 数组：把每个爱好都打印出来
      let hobbies = ["篮球", "羽毛球", "看电影", "游泳"];
      for (let i = 0; i < hobbies.length; i++) {
        console.log("爱好：" + hobbies[i]);
      }
    </script>
  </body>
</html>
