<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>我的第一个 JavaScript</title>
  </head>

  <body>
    <h1>按 F12 打开控制台，看看 Console 里输出了什么</h1>

    <!-- script 标签通常放在 body 的最后 -->
    <script>
      // JS 的注释用双斜杠 //
      console.log("你好，世界！");      // 输出到控制台
      console.log("我是被 JS 打印出来的");
      alert("欢迎学习 JavaScript！");   // 弹窗，用户能看到
    </script>
  </body>
</html>
