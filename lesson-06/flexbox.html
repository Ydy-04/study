<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Flexbox 示例</title>
    <style>
      .box {
        background-color: #ffe0b2;
        padding: 10px;
        margin: 5px;
      }

      /* ① 没开 flex：子盒子从上往下排（正常块级行为） */
      .normal {
        border: 2px solid gray;
        margin: 10px 0;
      }

      /* ② 开了 flex：子盒子立刻横着排 */
      .row {
        display: flex;
        border: 2px solid blue;
        margin: 10px 0;
      }

      /* ③ flex + 水平居中 + 垂直居中 + 间距 */
      .row-center {
        display: flex;
        justify-content: center; /* 水平方向：居中 */
        align-items: center;     /* 垂直方向：居中 */
        gap: 20px;               /* 子元素之间隔 20px */
        height: 120px;
        border: 2px solid green;
        margin: 10px 0;
      }
    </style>
  </head>

  <body>
    <h2>① 没开 flex：盒子从上往下排</h2>
    <div class="normal">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
    </div>

    <h2>② 加了 display: flex：子盒子横着排了</h2>
    <div class="row">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
    </div>

    <h2>③ 再加上 justify-content / align-items / gap</h2>
    <div class="row-center">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
    </div>
  </body>
</html>
