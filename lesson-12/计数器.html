<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DOM：让页面动起来</title>
    <style>
      body {
        text-align: center;
        font-family: sans-serif;
        margin-top: 60px;
      }
      button {
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <p>你点了<span id="num"> 0</span>次</p>
    <button id="btn">点我</button>

    <script>
        let count = 0;
        let num = document.querySelector("#num");
        let btn = document.querySelector("#btn");

        btn.addEventListener("click",function(){
            count = count+ 1;
            num.textContent = count;
        });
    </script>
  </body>
</html>
