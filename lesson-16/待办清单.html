<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>待办清单</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 400px;
        margin: 60px auto;
        padding: 0 20px;
      }
      input {
        padding: 8px;
        font-size: 16px;
        width: 250px;
      }
      button {
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        background-color: #f5f5f5;
        padding: 10px;
        margin: 6px 0;
        border-radius: 6px;
      }
    </style>
  </head>

  <body>
    <h1>我的待办清单</h1>

    <input id="input" placeholder="输入要办的事..." />
    <button id="addBtn">添加</button>

    <ul id="list"></ul>

    <script>
      // 1. 数据：用数组存所有待办
      let todos = [];

      // 2. 抓元素
      let input = document.querySelector("#input");
      let addBtn = document.querySelector("#addBtn");
      let list = document.querySelector("#list");

      // 3. 渲染函数：把 todos 数组"画"到页面上
      function render() {
        let html = "";
        for (let i = 0; i < todos.length; i++) {
          html = html + "<li>" + todos[i] + "</li>";
        }
        list.innerHTML = html;
      }

      // 4. 点击"添加"按钮
      addBtn.addEventListener("click", function () {
        let text = input.value;   // 拿到输入框里的文字
        if (text !== "") {        // 空内容就不加
          todos.push(text);       // 加入数组
          input.value = "";       // 清空输入框
          render();               // 重新渲染
        }
      });
    </script>
  </body>
</html>
