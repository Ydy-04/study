<!DOCTYPE html>
<!-- 这一行告诉浏览器：这是一个 HTML5 网页 -->
<html lang="zh-CN">
  <!-- html 是整个网页的"根"，lang 表示语言是简体中文 -->

  <head>
    <!-- head 里放的是"给浏览器看的"信息，不会显示在页面上 -->
    <meta charset="UTF-8" />
    <!-- 让浏览器用 UTF-8 编码，保证中文不乱码 -->
    <title>我的第一个网页</title>
    <!-- 浏览器标签页上显示的文字 -->
  </head>

  <body>
    <!-- body 里放的是"给用户看的"内容，都会显示在页面上 -->

    <h1>你好，我是前端实习生！</h1>
    <!-- h1 是一级标题，最大 -->

    <h2>这是我写的第一个网页</h2>
    <!-- h2 是二级标题，比 h1 小 -->

    <p>从今天开始，我要一步步学会前端开发。</p>
    <!-- p 是段落（paragraph） -->
  </body>
</html>
