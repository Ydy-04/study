<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>CSS 入门示例</title>

    <!-- style 标签里写 CSS -->
    <style>
      /* 这是 CSS 注释，浏览器会忽略，写法是 /* ... */ */

      body {
        background-color: #f0f0f0; /* 网页背景色：浅灰 */
      }

      h1 {
        color: #2c6fdb;        /* 文字颜色：蓝色 */
        font-size: 40px;       /* 字号：40 像素 */
        text-align: center;    /* 文字居中 */
      }

      p {
        color: #333333;        /* 文字颜色：深灰 */
        font-size: 18px;       /* 字号：18 像素 */
      }
    </style>
  </head>

  <body>
    <h1>我是被 CSS 打扮过的标题</h1>
    <p>我是一段文字，看看我的颜色和大小。</p>
  </body>
</html>
