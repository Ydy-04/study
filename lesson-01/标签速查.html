<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>HTML 常用标签速查</title>
  </head>

  <body>
    <!-- ============ 1. 标题：h1 最大，h6 最小 ============ -->
    <h1>这是一级标题 h1</h1>
    <h2>这是二级标题 h2</h2>
    <h3>这是三级标题 h3</h3>

    <!-- ============ 2. 段落 p ============ -->
    <p>这是一个段落。注意：HTML 会把你写的换行和多余空格都当成一个空格。</p>

    <!-- ============ 3. 链接 a，href 是跳转地址 ============ -->
    <a href="https://www.baidu.com">点我去百度</a>

    <!-- ============ 4. 图片 img（自闭合，没有结束标签） ============ -->
    <img src="https://picsum.photos/300/150" alt="一张示例图片" />

    <!-- ============ 5. 换行 br（自闭合） ============ -->
    <p>这是第一行<br />这是第二行</p>

    <!-- ============ 6. 无序列表 ul + li（圆点） ============ -->
    <ul>
      <li>苹果</li>
      <li>香蕉</li>
      <li>橘子</li>
    </ul>

    <!-- ============ 7. 有序列表 ol + li（1234） ============ -->
    <ol>
      <li>第一步</li>
      <li>第二步</li>
      <li>第三步</li>
    </ol>
  </body>
</html>
